name: ReleasePulse CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # 1. BUILD AND TEST
  # ==========================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          mvn -B clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasepulse-war
          path: target/releasepulse.war


  # ==========================================================
  # 2. SONARQUBE ANALYSIS
  # ==========================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test SonarQube connection
        run: |
          curl -f "${{ secrets.SONAR_HOST_URL }}/api/system/status"

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=releasepulse \
            -Dsonar.projectName=ReleasePulse \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

      - name: Check SonarQube scanner result
        run: |
          echo "Checking SonarQube scanner output..."
          if [ -f ".scannerwork/report-task.txt" ]; then
            echo "SonarQube scanner report found."
            cat .scannerwork/report-task.txt
          else
            echo "WARNING: .scannerwork/report-task.txt not found."
            echo "The SonarQube scanner command completed."
          fi

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================================
  # 3. UPLOAD WAR TO NEXUS
  # ==========================================================
  nexus:
    name: Upload WAR to Nexus
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: releasepulse-war
          path: target

      - name: Verify WAR file
        run: |
          echo "Checking WAR file..."
          ls -lh target/
          test -f target/releasepulse.war

      - name: Upload WAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn -B deploy:deploy-file \
            -Dfile=target/releasepulse.war \
            -DgroupId=com.releasepulse \
            -DartifactId=releasepulse \
            -Dversion=1.0.0 \
            -Dpackaging=war \
            -DrepositoryId=nexus-releases \
            -Durl=http://3.237.61.86:8081/repository/releasepulse-releases/ \
            --settings settings.xml


  # ==========================================================
  # 4. DEPLOY TO TOMCAT
  # ==========================================================
  deploy:
    name: Deploy to Tomcat
    runs-on: ubuntu-latest
    needs: nexus

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: releasepulse-war
          path: target

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          echo "Deploying ReleasePulse to Tomcat..."

          curl -f -u "${TOMCAT_USERNAME}:${TOMCAT_PASSWORD}" \
            -T target/releasepulse.war \
            "http://${TOMCAT_HOST}:8080/manager/text/deploy?path=/releasepulse&update=true"

          echo "Deployment completed successfully."

      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          sleep 10

          curl -f \
            "http://${TOMCAT_HOST}:8080/releasepulse/"

          echo
          echo "ReleasePulse deployment verified successfully."