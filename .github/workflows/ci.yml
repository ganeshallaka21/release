name: ReleasePulse CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. BUILD AND TEST
  # ==========================================================

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          mvn -B clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasepulse-war
          path: target/releasepulse.war


  # ==========================================================
  # 2. SONARQUBE ANALYSIS
  # ==========================================================

  sonar:
    name: SonarQube Analysis
    needs: build-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ------------------------------------------------------
      # Test connection to SonarQube
      # ------------------------------------------------------

      - name: Test SonarQube connection
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Testing SonarQube connection..."
          echo "SonarQube URL: $SONAR_HOST_URL"

          curl --fail \
               --connect-timeout 10 \
               --max-time 30 \
               "$SONAR_HOST_URL/api/system/status"

          echo
          echo "SonarQube connection successful."

      # ------------------------------------------------------
      # Run SonarQube
      # ------------------------------------------------------

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.4.0.6343:sonar \
            -Dsonar.projectKey=releasepulse \
            -Dsonar.projectName=ReleasePulse \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # ------------------------------------------------------
      # Show scanner files
      # ------------------------------------------------------

      - name: Verify SonarQube scanner output
        if: always()
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Project files ====="
          ls -la

          echo "===== Scanner directory ====="
          if [ -d ".scannerwork" ]; then
            ls -la .scannerwork
          else
            echo ".scannerwork directory was not created."
          fi

          echo "===== Sonar related files ====="
          find . -maxdepth 4 -type f \
            \( -name "*sonar*" -o -name "report-task.txt" \) \
            -print || true

      # ------------------------------------------------------
      # Quality Gate
      # ------------------------------------------------------

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================================
  # 3. UPLOAD WAR TO NEXUS
  # ==========================================================

  nexus:
    name: Upload WAR to Nexus
    needs: sonar
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: releasepulse-war
          path: target

      - name: Verify WAR
        run: |
          ls -lh target/
          test -f target/releasepulse.war

      # ------------------------------------------------------
      # Deploy WAR to Nexus
      # ------------------------------------------------------

      - name: Upload WAR to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn -B deploy:deploy-file \
            -Dfile=target/releasepulse.war \
            -DgroupId=com.releasepulse \
            -DartifactId=releasepulse \
            -Dversion=1.0.0 \
            -Dpackaging=war \
            -DrepositoryId=nexus-releases \
            -Durl="$NEXUS_URL" \
            -Dusername="$NEXUS_USERNAME" \
            -Dpassword="$NEXUS_PASSWORD"


  # ==========================================================
  # 4. DEPLOY TO TOMCAT
  # ==========================================================

  deploy:
    name: Deploy to Tomcat
    needs: nexus
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: releasepulse-war
          path: target

      - name: Verify WAR
        run: |
          ls -lh target/
          test -f target/releasepulse.war

      # ------------------------------------------------------
      # Copy WAR to Tomcat
      # ------------------------------------------------------

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_SSH_KEY: ${{ secrets.TOMCAT_SSH_KEY }}
        run: |

          echo "$TOMCAT_SSH_KEY" > tomcat_key.pem

          chmod 600 tomcat_key.pem

          ssh \
            -o StrictHostKeyChecking=no \
            -i tomcat_key.pem \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "sudo systemctl stop tomcat || true"

          scp \
            -o StrictHostKeyChecking=no \
            -i tomcat_key.pem \
            target/releasepulse.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/releasepulse.war"

          ssh \
            -o StrictHostKeyChecking=no \
            -i tomcat_key.pem \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "sudo rm -rf /var/lib/tomcat10/webapps/releasepulse && \
             sudo rm -f /var/lib/tomcat10/webapps/releasepulse.war && \
             sudo mv /tmp/releasepulse.war /var/lib/tomcat10/webapps/releasepulse.war && \
             sudo systemctl start tomcat"

          rm -f tomcat_key.pem

          echo "Deployment completed successfully."