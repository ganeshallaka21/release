name: ReleasePulse CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasepulse-war
          path: target/*.war


  sonar:
    name: SonarQube Analysis
    needs: build-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.4.0.6343:sonar \
            -Dsonar.projectKey=releasepulse \
            -Dsonar.projectName=ReleasePulse \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Check SonarQube report
        run: |
          echo "Checking SonarQube scanner output..."
          ls -la
          ls -la .scannerwork || true
          test -f .scannerwork/report-task.txt

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  nexus:
    name: Upload Artifact to Nexus
    needs: sonar
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Deploy WAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
        run: |
          mvn -B deploy \
            -s settings.xml \
            -DskipTests


  deploy:
    name: Deploy to Tomcat
    needs: nexus
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build WAR
        run: mvn -B clean package -DskipTests

      - name: Prepare SSH
        env:
          TOMCAT_SSH_KEY: ${{ secrets.TOMCAT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TOMCAT_SSH_KEY" > ~/.ssh/tomcat.pem
          chmod 600 ~/.ssh/tomcat.pem

      - name: Copy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/tomcat.pem \
            target/*.war \
            ubuntu@$TOMCAT_HOST:/tmp/releasepulse.war

      - name: Deploy WAR
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/tomcat.pem \
            ubuntu@$TOMCAT_HOST << 'EOF'

          sudo systemctl stop tomcat

          sudo rm -rf /opt/tomcat/webapps/releasepulse
          sudo rm -f /opt/tomcat/webapps/releasepulse.war

          sudo mv /tmp/releasepulse.war /opt/tomcat/webapps/releasepulse.war

          sudo chown tomcat:tomcat /opt/tomcat/webapps/releasepulse.war

          sudo systemctl start tomcat

          sleep 15

          curl -f http://localhost:8080/releasepulse/

          EOF